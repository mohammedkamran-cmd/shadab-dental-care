# Free hosting on Render (https://render.com). See "Put it online" in README.md.
# Bookings are stored in a free Turso database (turso.tech), so they survive restarts.
services:
  - type: web
    name: shadab-dental-care
    runtime: node
    plan: free
    buildCommand: echo "no build needed"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_KEY
        generateValue: true  # your staff password; see it in Render > Environment
      - key: TURSO_DATABASE_URL
        sync: false          # paste from Turso when Render asks
      - key: TURSO_AUTH_TOKEN
        sync: false          # paste from Turso when Render asks
