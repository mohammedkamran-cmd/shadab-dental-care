# One-click hosting on Render (https://render.com). See "Put it online" in README.md.
services:
  - type: web
    name: shadab-dental-care
    runtime: node
    plan: starter            # paid plan (~$7/month) so the bookings disk below is kept safely
    buildCommand: echo "no build needed"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DB_PATH
        value: /var/data/appointments.sqlite
      - key: ADMIN_KEY
        generateValue: true  # your staff password; see it in Render > Environment
    disk:
      name: bookings
      mountPath: /var/data
      sizeGB: 1
